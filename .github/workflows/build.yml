name: Build mod jar

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0
      - name: Build
        run: gradle build --no-daemon -Pmod_version=2.1.${{ github.run_number }}
      - name: Inspect API (temporary)
        continue-on-error: true
        shell: bash {0}
        run: |
          MJ=$(find . -path '*loom-cache*' -name 'minecraft-merged-*.jar' | head -1)
          FJ=$(find ~/.gradle -name 'fabric-networking-api-v1-*.jar' | head -1)
          LJ=$(find ~/.gradle -name 'fabric-lifecycle-events-v1-*.jar' | head -1)
          MSG=$(find ~/.gradle -name 'fabric-message-api-v1-*.jar' | head -1)
          CP="$MJ:$FJ:$LJ:$MSG"
          unzip -l "$MJ" | awk '{print $4}' | grep -E 'screens/(ConnectScreen|DisconnectedScreen|TitleScreen)|multiplayer/(JoinMultiplayerScreen|resolver/ServerAddress)|multiplayer/ServerData\.class|scores/(Scoreboard|Objective|DisplaySlot|PlayerTeam|PlayerScoreEntry)\.class'
          for c in net.minecraft.client.gui.screens.ConnectScreen net.minecraft.client.multiplayer.resolver.ServerAddress net.minecraft.client.multiplayer.ServerData; do echo "--- $c"; javap -public -cp "$CP" "$c" | grep -E 'static|public .*\(|class' | head -25; done
          for c in net.minecraft.world.scores.Scoreboard net.minecraft.world.scores.PlayerTeam net.minecraft.world.scores.PlayerScoreEntry net.minecraft.world.scores.Objective net.minecraft.world.scores.DisplaySlot; do echo "--- $c"; javap -public -cp "$CP" "$c" | grep -iE 'class|record|getDisplayObjective|listPlayerScores|getPlayersTeam|formatNameForTeam|getPlayerPrefix|getPlayerSuffix|owner|display|SIDEBAR|getDisplayName|isHidden|value' | head -30; done
          javap -public -cp "$MJ" net.minecraft.client.Minecraft | grep -iE 'getCurrentServer|disconnect|setScreen|isSingleplayer'
          find / -path /proc -prune -o -name 'net/minecraft/client/gui/screens/DisconnectedScreen.class' -print 2>/dev/null | head -1
          unzip -l "$MJ" | awk '{print $4}' | grep -E 'DisconnectedScreen|TitleScreen\.class|JoinMultiplayerScreen\.class'
          for c in net.fabricmc.fabric.api.client.networking.v1.ClientPlayConnectionEvents 'net.fabricmc.fabric.api.client.networking.v1.ClientPlayConnectionEvents$Disconnect' 'net.fabricmc.fabric.api.client.networking.v1.ClientPlayConnectionEvents$Join' net.fabricmc.fabric.api.client.message.v1.ClientReceiveMessageEvents 'net.fabricmc.fabric.api.client.message.v1.ClientReceiveMessageEvents$Game'; do echo "--- $c"; javap -public -cp "$CP" "$c" | head -12; done
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: glowing-mushroom-auto
          path: build/libs/glowing-mushroom-auto-*[0-9].jar
      - name: Publish latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name=="latest-build") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest-build" || true
          gh release create latest-build build/libs/glowing-mushroom-auto-*[0-9].jar \
            --prerelease --title "Latest build" --target "$GITHUB_SHA" \
            --notes "Automatic build of $GITHUB_SHA"
