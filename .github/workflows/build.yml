name: Build mod jar

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0
      - name: Build
        run: gradle build --no-daemon
      - name: Inspect API (temporary)
        continue-on-error: true
        run: |
          echo "=== JARS ==="
          find ~/.gradle -name '*.jar' | grep -iE 'minecraft|fabric-(rendering|lifecycle|api)' | head -40
          for j in $(find ~/.gradle -name '*.jar' | grep -iE 'minecraft|fabric-rendering|fabric-api'); do
            if unzip -l "$j" 2>/dev/null | grep -qE 'gizmos/Gizmos.class|WorldRenderEvents|LevelRenderEvents'; then
              echo "=== $j ==="
              unzip -l "$j" | grep -E 'gizmos/|RenderEvents' | awk '{print $4}' | head -60
              for c in net.minecraft.gizmos.Gizmos net.minecraft.gizmos.GizmoStyle net.minecraft.gizmos.GizmoProperties net.minecraft.gizmos.TextGizmo net.minecraft.gizmos.TextGizmo\$Style net.minecraft.gizmos.CuboidGizmo net.minecraft.gizmos.LineGizmo net.minecraft.gizmos.GizmoCollector net.fabricmc.fabric.api.client.rendering.v1.world.LevelRenderEvents net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderEvents; do
                javap -public -cp "$j" "$c" 2>/dev/null
              done
            fi
          done
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: glowing-mushroom-auto
          path: build/libs/glowing-mushroom-auto-*[0-9].jar
      - name: Publish latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name=="latest-build") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest-build" || true
          gh release create latest-build build/libs/glowing-mushroom-auto-*[0-9].jar \
            --prerelease --title "Latest build" --target "$GITHUB_SHA" \
            --notes "Automatic build of $GITHUB_SHA"
