name: Build mod jar

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0
      - name: Build
        run: gradle build --no-daemon
      - name: Inspect API (temporary)
        continue-on-error: true
        shell: bash {0}
        run: |
          RJ=$(find ~/.gradle -name 'fabric-rendering-v1-*.jar' | head -1)
          echo "=== events ==="
          for c in 'LevelRenderEvents' 'LevelRenderEvents$BeforeGizmos' 'LevelRenderEvents$CollectSubmits' 'LevelRenderEvents$EndMain' 'LevelRenderEvents$AfterTranslucentFeatures'; do
            javap -public -cp "$RJ" "net.fabricmc.fabric.api.client.rendering.v1.level.$c"
          done
          echo "=== context classes ==="
          unzip -l "$RJ" | awk '{print $4}' | grep -E 'level/.*Context' | head
          for c in $(unzip -l "$RJ" | awk '{print $4}' | grep -E 'level/.*Context.*\.class$' | sed 's/\.class//; s#/#.#g' | head -6); do javap -public -cp "$RJ" "$c"; done
          echo "=== minecraft jars ==="
          find / -name '*.jar' 2>/dev/null | grep -iE 'minecraft' | grep -v -E 'fabric-api|hostedtoolcache' | head -10
          MJ=$(find / -name '*.jar' 2>/dev/null | grep -iE 'minecraft' | grep -v -E 'fabric-api|hostedtoolcache|sources' | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/gizmos/Gizmos.class" && echo "{}"' | head -1)
          echo "MJ=$MJ"
          for c in net.minecraft.gizmos.Gizmos net.minecraft.gizmos.GizmoStyle net.minecraft.gizmos.GizmoProperties net.minecraft.gizmos.TextGizmo 'net.minecraft.gizmos.TextGizmo$Style' net.minecraft.gizmos.GizmoPrimitives; do
            echo "--- $c"; javap -public -cp "$MJ" "$c"
          done
          unzip -l "$MJ" | awk '{print $4}' | grep 'net/minecraft/gizmos/' | head -40
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: glowing-mushroom-auto
          path: build/libs/glowing-mushroom-auto-*[0-9].jar
      - name: Publish latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name=="latest-build") | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/latest-build" || true
          gh release create latest-build build/libs/glowing-mushroom-auto-*[0-9].jar \
            --prerelease --title "Latest build" --target "$GITHUB_SHA" \
            --notes "Automatic build of $GITHUB_SHA"
